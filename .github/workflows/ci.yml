# Checks every push and pull request: the app (analyzer, tests, web build), the ESP32
# firmware (compiles with arduino-cli) and the printable parts (every .scad renders).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --reporter expanded
      - run: flutter build web --release

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: ESP32 core and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install "NimBLE-Arduino" "ESP32Servo" "Adafruit NeoPixel"
      - name: Compile
        run: arduino-cli compile --fqbn esp32:esp32:esp32 --output-dir build firmware/OpenRook
      - uses: actions/upload-artifact@v4
        with:
          name: openrook-firmware
          path: build/OpenRook.ino.merged.bin
          retention-days: 30

  printables:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q openscad
      - run: 3d-prints/render.sh
      - name: STLs in the repo match the sources
        run: |
          if ! git diff --quiet --stat -- 3d-prints/stl; then
            echo "::warning::3d-prints/stl is out of date with src/: run 3d-prints/render.sh and commit (fresh STLs are attached to this run)."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: openrook-stl
          path: 3d-prints/stl
          retention-days: 30
